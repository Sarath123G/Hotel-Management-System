{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Hotel Room Bookings{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <h1>Hotel Room Bookings</h1>
    </header>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'add_booking' %}">Add Booking</a>
        <a href="{% url 'booking_list' %}">View Bookings</a>
    </nav>
    <div class="container">
        {% if messages %}
            {% for message in messages %}
            <p class="message">{{ message }}</p>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
    <footer>
        <p>&copy; 2026 Hotel Room Bookings</p>
    </footer>
</body>
</html>
